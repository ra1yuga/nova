name: Nova Modern build

on:
  push:
    branches: [ modern-ui ]
  workflow_dispatch:

concurrency:
  group: nova-modern-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      # OnePlus 13 and other modern phones are arm64 only: skip the other native ABIs to cut build time
      NDK_CPU_ARM_64: 1
      NDK_CPU_ARM_NEON: 0
      NDK_CPU_X86: 0
      NDK_CPU_X86_64: 0
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Check out this fork
        uses: actions/checkout@v4
        with:
          path: fork

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install build packages
        run: |
          sudo apt-get update || sudo apt-get update
          sudo apt-get install -y nasm meson ninja-build build-essential wget curl unzip git pkg-config

      - name: Install Android NDK and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --install "ndk;29.0.14206865" "cmake;3.22.1" > /dev/null
          ls "$ANDROID_HOME/ndk"

      - name: Install repo tool
        run: |
          curl -s https://storage.googleapis.com/git-repo-downloads/repo | sudo tee /usr/local/bin/repo > /dev/null
          sudo chmod a+x /usr/local/bin/repo

      - name: Fetch the rest of Nova (engine, media library, file library)
        run: |
          mkdir nova && cd nova
          repo init -u https://github.com/nova-video-player/aos-AVP -b nova -m v6_4.xml --depth=1
          repo sync -c -j8 --no-tags --no-clone-bundle
          repo forall -c 'git checkout -q -t $REPO_REMOTE/$REPO_RREV' || true

      - name: Swap in this fork as the Video UI module
        run: |
          rm -rf nova/Video
          cp -a fork nova/Video
          rm -rf nova/Video/.git

      - name: Rename media providers so this installs next to the official Nova
        run: |
          cd nova
          F=MediaLib/src/com/archos/mediaprovider/ArchosMediaCommon.java
          sed -i 's/"com.archos.media.videocommunity"/"com.archos.media.videomodern"/; s/"com.archos.media.scrapercommunity"/"com.archos.media.scrapermodern"/' "$F"
          grep -n "AUTHORITY_VIDEO\|AUTHORITY_SCRAPER" "$F"
          grep -q '"com.archos.media.videomodern"' "$F"
          grep -q '"com.archos.media.scrapermodern"' "$F"

      - name: Build the APK
        run: |
          cd nova/Video
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleNoamazonRelease -x lintNoamazonRelease

      - name: Collect the APK
        id: apk
        run: |
          ls -la nova/Video/build/outputs/apk/noamazon/release/
          APK=$(ls nova/Video/build/outputs/apk/noamazon/release/*arm64-v8a*.apk | head -n 1)
          mkdir -p out
          cp "$APK" out/NovaModern-arm64.apk
          echo "path=out/NovaModern-arm64.apk" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaModern-arm64
          path: out/NovaModern-arm64.apk

      - name: Publish as a GitHub release (download from your phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="modern-build-${{ github.run_number }}"
          SHORT=$(cd fork && git rev-parse --short HEAD)
          gh release create "$TAG" out/NovaModern-arm64.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Nova Modern build ${{ github.run_number }}" \
            --notes "Nova Modern for arm64 phones (OnePlus 13). Built from ${SHORT}. Install NovaModern-arm64.apk; it installs next to the official Nova app." \
            --latest
